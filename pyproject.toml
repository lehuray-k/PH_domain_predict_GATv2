[project]
name = "ph-domain-predict-gatv2"
version = "1.0.0"
description = "Prediction of lipid interaction sites on Pleckstrin Homology domain structures"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.1.2",
    "matplotlib",
    "tensorflow==2.13.0",
    "keras",
    "mdtraj>=1.9.7,<2.0",
    "biopython==1.81"
    ]

[dependency-groups]
dev = [
    "ipykernel",
    "mypy",
    "pytest>=8.4.2",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP"]
ignore = ["N"] # ignore name format conventions

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

line-ending = "auto"